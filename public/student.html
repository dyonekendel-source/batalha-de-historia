<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Aluno — Batalha de História</title><link rel="stylesheet" href="/static/style.css"></head><body class="student-body"><main class="center"><div class="card student-card"><div class="logo">⚔️</div><span class="eyebrow">BATALHA DE HISTÓRIA</span><h1>Entre na partida</h1><section id="join"><input id="name" maxlength="24" placeholder="Seu nome ou apelido"><input id="room" maxlength="4" placeholder="Código da sala" style="text-transform:uppercase"><button class="btn primary wide" onclick="join()">Entrar na sala</button><p id="err" class="error"></p></section><section id="play" class="hidden"><div class="mobile-top"><span id="progress"></span><strong id="score"></strong></div><div id="qwrap"></div><div id="answers" class="answers mobile"></div><div id="msg" class="student-msg"></div></section></div></main><script>
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'),params=new URLSearchParams(location.search);if(params.get('room'))document.getElementById('room').value=params.get('room').toUpperCase();function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function join(){const n=document.getElementById('name').value.trim(),r=document.getElementById('room').value.trim().toUpperCase();if(!n||!r){document.getElementById('err').textContent='Informe seu nome e o código da sala.';return}ws.send(JSON.stringify({action:'join',name:n,room:r}))}
ws.onmessage=e=>{const st=JSON.parse(e.data);if(st.type==='error'){document.getElementById('err').textContent=st.message;return}if(st.type==='joined'){document.getElementById('join').classList.add('hidden');document.getElementById('play').classList.remove('hidden');return}if(st.type!=='state')return;document.getElementById('score').textContent=(st.score||0).toLocaleString('pt-BR')+' pts';if(st.phase==='question'){document.getElementById('progress').textContent=`QUESTÃO ${st.questionNumber}/10`;document.getElementById('qwrap').innerHTML=`<h2 class="mobile-question">${esc(st.question.question)}</h2>`;document.getElementById('answers').innerHTML=st.question.options.map((x,i)=>`<button class="answerbtn" onclick="answer(${i})"><b>${String.fromCharCode(65+i)}</b><span>${esc(x)}</span></button>`).join('');document.getElementById('msg').textContent=st.answered?'✓ Resposta enviada. Aguarde o professor.':''}else if(st.phase==='result'){const r=st.result||{};const ok=r.correct===true;document.getElementById('progress').textContent=`RESULTADO ${st.questionNumber}/10`;document.getElementById('qwrap').innerHTML=`<div class="student-result"><div class="big ${ok?'success':''}">${ok?'✓':'✕'}</div><h2>${ok?'Você acertou!':'Você errou!'}</h2><div class="correct-answer">Resposta correta: ${String.fromCharCode(65+(r.correctIndex??0))} — ${esc(r.correctAnswer||'')}</div></div>`;document.getElementById('answers').innerHTML='';document.getElementById('msg').textContent=ok?'Você ganhou 1.000 pontos. Aguarde o professor liberar a próxima questão.':'0 pontos nesta questão. Aguarde o professor liberar a próxima questão.'}else if(st.phase==='podium'){document.getElementById('progress').textContent='PÓDIO FINAL';document.getElementById('qwrap').innerHTML='<div class="student-result"><div class="big">🏆</div><h2>Partida encerrada!</h2><p>Confira o pódio na tela do professor.</p></div>';document.getElementById('answers').innerHTML='';document.getElementById('msg').textContent=`Sua pontuação: ${(st.score||0).toLocaleString('pt-BR')} pontos.`}else if(st.phase==='final'){document.getElementById('progress').textContent='FIM DA PARTIDA';document.getElementById('qwrap').innerHTML='<div class="student-result"><div class="big">🎉</div><h2>Obrigado por jogar!</h2></div>';document.getElementById('answers').innerHTML='';document.getElementById('msg').textContent=`Sua pontuação final: ${(st.score||0).toLocaleString('pt-BR')} pontos.`}};function answer(i){ws.send(JSON.stringify({action:'answer',index:i}));document.querySelectorAll('.answerbtn').forEach(b=>b.disabled=true);document.getElementById('msg').textContent='✓ Resposta enviada. Aguarde o professor.'}
</script></body></html>
