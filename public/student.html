<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aluno — Batalha de História</title><link rel="stylesheet" href="style.css"></head><body><main class="center"><div class="card student"><div class="logo">🏛️</div><h1>Batalha de História</h1><section id="join"><input id="name" maxlength="24" placeholder="Seu nome ou apelido"><input id="room" maxlength="4" placeholder="Código da sala" style="text-transform:uppercase"><button class="btn" onclick="join()">Entrar</button><p id="err" class="error"></p></section><section id="play" class="hidden"><div class="topline"><span id="progress"></span><span id="timer"></span></div><div id="score"></div><h2 id="q"></h2><div id="answers" class="answers mobile"></div><div id="msg"></div></section></div></main><script>const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');const params=new URLSearchParams(location.search);if(params.get('room'))document.getElementById('room').value=params.get('room').toUpperCase();function join(){const name=document.getElementById('name').value.trim(),room=document.getElementById('room').value.trim().toUpperCase();if(!name||!room){document.getElementById('err').textContent='Informe seu nome e o código da sala.';return}ws.send(JSON.stringify({action:'join',name,room}))}ws.onmessage=e=>{const st=JSON.parse(e.data);if(st.type==='error'){document.getElementById('err').textContent=st.message;return}if(st.type==='joined'){document.getElementById('join').classList.add('hidden');document.getElementById('play').classList.remove('hidden');return}if(st.type==='state'&&st.phase==='question'){document.getElementById('progress').textContent=`QUESTÃO ${st.questionNumber}/10`;document.getElementById('timer').textContent=`⏱ ${st.timeLeft}s`;document.getElementById('score').textContent=`${st.score} pontos`;document.getElementById('q').textContent=st.question.question;document.getElementById('answers').innerHTML=st.question.options.map((x,i)=>`<button class="answerbtn" onclick="answer(${i})"><b>${String.fromCharCode(65+i)}</b>${x}</button>`).join('');document.getElementById('msg').textContent=st.answered?'Resposta enviada!':''}else if(st.type==='state'&&st.phase==='result'){document.getElementById('answers').innerHTML='';document.getElementById('msg').textContent=`Pontuação: ${st.score} pontos. Aguarde a próxima questão.`;document.getElementById('timer').textContent=''}else if(st.type==='state'&&st.phase==='podium'){document.getElementById('q').textContent='🏆 Partida encerrada!';document.getElementById('answers').innerHTML='';document.getElementById('msg').textContent=`Sua pontuação final: ${st.score} pontos.`}};function answer(i){ws.send(JSON.stringify({action:'answer',index:i}));document.querySelectorAll('.answerbtn').forEach(b=>b.disabled=true)}</script></body></html>
