<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel do admin — Estudativa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/static/style.css">
<style>
  .admin-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .admin-tab{border:1px solid var(--line);background:#0b1829;color:var(--muted);border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer}
  .admin-tab.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
  .admin-item{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;background:rgba(7,16,28,.48)}
  .admin-item .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
  .admin-item .pergunta{font-weight:800;margin-bottom:8px}
  .admin-item .resposta{color:var(--muted);white-space:pre-wrap;font-size:14px;line-height:1.5}
  .admin-item.alerta{border-color:#ff7a7f}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;margin-right:6px;color:var(--muted)}
  .tag.alerta{color:#ff7a7f;border-color:#ff7a7f}
  .topbar-admin{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  #loginBox{max-width:420px;margin:90px auto;padding:36px}
  #loginBox input{margin-bottom:14px}
  #loginError{color:var(--danger);margin-bottom:10px;min-height:18px}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px}
  .stat-card{flex:1;min-width:140px;border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(7,16,28,.48);text-align:center}
  .stat-card .num{font-size:32px;font-weight:900;color:var(--accent)}
  .stat-card .label{color:var(--muted);font-size:13px;margin-top:4px}
</style>
</head>
<body>
<main class="app">

  <section id="loginBox" class="card hidden">
    <span class="eyebrow">Área restrita</span>
    <h1 style="margin:6px 0 20px;font-size:26px">Painel do admin</h1>
    <p id="loginError"></p>
    <label for="pw">Senha</label>
    <input id="pw" type="password" placeholder="Sua senha de admin" autocomplete="current-password">
    <button class="btn primary wide" onclick="login()">Entrar</button>
  </section>

  <section id="dash" class="hidden">
    <header class="topbar-admin">
      <div>
        <span class="eyebrow">Estudativa</span>
        <h1 style="margin:6px 0 0;font-size:30px">Painel do admin</h1>
      </div>
      <button class="btn secondary" onclick="logout()">Sair</button>
    </header>

    <div class="stat-row" id="stats"></div>

    <div class="admin-tabs">
      <button class="admin-tab selected" data-tab="ia" onclick="selectTab('ia')">🤖 Perguntas à IA</button>
      <button class="admin-tab" data-tab="jogos" onclick="selectTab('jogos')">🎮 Jogos criados</button>
      <button class="admin-tab" data-tab="contrib" onclick="selectTab('contrib')">✍️ Perguntas de professores</button>
      <button class="admin-tab" data-tab="mapas" onclick="selectTab('mapas')">🧠 Mapas mentais</button>
      <button class="admin-tab" data-tab="curador" onclick="selectTab('curador')">🧭 Robô Curador</button>
    </div>

    <section class="card" style="padding:24px">
      <div id="content"><p class="muted">Carregando...</p></div>
    </section>
  </section>

</main>
<script src="https://www.estudativa.com.br/js/mindmap-engine.js"></script>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let cache = {ia: null, jogos: null, contrib: null, mapas: null, curador: [], curadorStatus: null};
let activeTab = location.hash === '#curador' ? 'curador' : 'ia';

async function checkLogin(){
  const r = await fetch('/api/admin/check');
  const data = await r.json();
  if (data.ok) { showDash(); } else { showLogin(); }
}

function showLogin(){
  $('loginBox').classList.remove('hidden');
  $('dash').classList.add('hidden');
}

function showDash(){
  $('loginBox').classList.add('hidden');
  $('dash').classList.remove('hidden');
  loadAll();
}

async function login(){
  const pw = $('pw').value;
  $('loginError').textContent = '';
  if (!pw) return;
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw}),
    });
    const data = await r.json();
    if (r.ok && data.ok) {
      $('pw').value = '';
      showDash();
    } else {
      $('loginError').textContent = data.error || 'Senha incorreta.';
    }
  } catch (e) {
    $('loginError').textContent = 'Erro ao conectar com o servidor.';
  }
}
$('pw') && $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function logout(){
  await fetch('/api/admin/logout', {method: 'POST'});
  showLogin();
}

async function loadAll(){
  const [ia, jogos, contrib, mapas, curador, curadorStatus] = await Promise.all([
    fetch('/api/admin/ia-perguntas').then(r => r.ok ? r.json() : []),
    fetch('/api/admin/jogos').then(r => r.ok ? r.json() : []),
    fetch('/api/admin/contribuicoes').then(r => r.ok ? r.json() : []),
    fetch('/api/admin/mapas-pendentes').then(r => r.ok ? r.json() : []),
    fetch('/api/admin/curador/relatorios').then(r => r.ok ? r.json() : []),
    fetch('/api/admin/curador/status').then(r => r.ok ? r.json() : null),
  ]);
  cache = {ia, jogos, contrib, mapas, curador, curadorStatus};
  renderStats();
  selectTab(activeTab);
}

function renderStats(){
  const totalPerguntasCriadas = (cache.contrib||[]).reduce((n,c)=>n+(c.perguntas||[]).length,0);
  $('stats').innerHTML = `
    <div class="stat-card"><div class="num">${cache.ia.length}</div><div class="label">Perguntas à IA</div></div>
    <div class="stat-card"><div class="num">${cache.jogos.length}</div><div class="label">Jogos criados</div></div>
    <div class="stat-card"><div class="num">${cache.contrib.length}</div><div class="label">Lotes de perguntas de professores</div></div>
    <div class="stat-card"><div class="num">${totalPerguntasCriadas}</div><div class="label">Perguntas criadas (total)</div></div>
    <div class="stat-card"><div class="num">${cache.mapas.length}</div><div class="label">Mapas mentais pendentes</div></div>
  `;
}

function selectTab(tab){
  activeTab = tab;
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.toggle('selected', b.dataset.tab === tab));
  renderTab();
}

function renderTab(){
  const el = $('content');
  if (activeTab === 'curador') { renderCurador(el); return; }
  if (activeTab === 'ia') {
    if (!cache.ia.length) { el.innerHTML = '<p class="muted">Nenhuma pergunta registrada ainda.</p>'; return; }
    el.innerHTML = cache.ia.map(item => `
      <div class="admin-item ${item.alerta ? 'alerta' : ''}">
        <div class="meta">${esc(item.criadoEm)}${item.alerta ? ' <span class="tag alerta">⚠ alerta de crise</span>' : ''}${item.comReferencia ? ' <span class="tag">usou referência do site</span>' : ''}</div>
        <div class="pergunta">❓ ${esc(item.pergunta)}</div>
        <div class="resposta">${esc(item.resposta)}</div>
      </div>
    `).join('');
  } else if (activeTab === 'jogos') {
    if (!cache.jogos.length) { el.innerHTML = '<p class="muted">Nenhum jogo registrado ainda.</p>'; return; }
    el.innerHTML = cache.jogos.map(item => `
      <div class="admin-item">
        <div class="meta">${esc(item.criadoEm)} · sala ${esc(item.sala)} <span class="tag">${item.tipo === 'personalizado' ? 'personalizado' : 'banco oficial'}</span></div>
        <div class="pergunta">🎮 ${esc(item.tema)} <small class="muted" style="font-weight:400">(${esc(item.disciplina)})</small></div>
        ${item.professor ? `<div class="resposta">Professor: ${esc(item.professor)}</div>` : ''}
      </div>
    `).join('');
  } else if (activeTab === 'contrib') {
    if (!cache.contrib.length) { el.innerHTML = '<p class="muted">Nenhuma contribuição pendente ainda.</p>'; return; }
    el.innerHTML = cache.contrib.map(item => `
      <div class="admin-item">
        <div class="meta">${esc(item.criadoEm)}${item.professor ? ' · ' + esc(item.professor) : ''} · id ${esc(item.id)}</div>
        <div class="pergunta">✍️ ${esc(item.disciplina)} — ${esc(item.tema)}</div>
        <ol style="padding-left:20px;color:var(--muted);margin-top:10px">
          ${item.perguntas.map(p => `<li style="margin-bottom:8px"><b style="color:var(--text)">${esc(p.question)}</b><br>${p.options.map(o => o === p.correct_answer ? `✅ ${esc(o)}` : `— ${esc(o)}`).join('<br>')}</li>`).join('')}
        </ol>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn primary" onclick="aprovarContribuicao('${esc(item.id)}')">✅ Aprovar e incluir no banco oficial</button>
          <button class="btn secondary" onclick="rejeitarContribuicao('${esc(item.id)}')">🗑 Rejeitar</button>
          <button class="btn secondary" onclick='copiar(${JSON.stringify(JSON.stringify(item))})'>📋 Copiar como JSON</button>
        </div>
      </div>
    `).join('');
  } else if (activeTab === 'mapas') {
    if (!cache.mapas.length) { el.innerHTML = '<p class="muted">Nenhum mapa mental pendente.</p>'; return; }
    el.innerHTML = cache.mapas.map(item => `
      <div class="admin-item">
        <div class="meta">${esc(item.criadoEm)}${item.autor ? ' · ' + esc(item.autor) : ' · gerado sem nome de autor'} · ${esc(item.disciplina)} · ${esc(item.ano)} · id ${esc(item.id)}</div>
        <div class="pergunta">🧠 ${esc(item.titulo)} <small class="muted" style="font-weight:400">(tema: ${esc(item.tema)})</small></div>
        <div id="mmPreview-${esc(item.id)}" style="max-width:420px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fbfaf6;margin:10px 0"></div>
        <textarea id="mmEdit-${esc(item.id)}" class="hidden" style="width:100%;min-height:160px;font-family:monospace;font-size:12px">${esc(JSON.stringify({titulo:item.titulo, ramos:item.ramos}, null, 2))}</textarea>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn primary" onclick="aprovarMapa('${esc(item.id)}')">✅ Aprovar</button>
          <button class="btn secondary" onclick="toggleEditarMapa('${esc(item.id)}')">✏️ Editar</button>
          <button class="btn secondary" onclick="salvarEdicaoMapa('${esc(item.id)}')">💾 Salvar edição</button>
          <button class="btn secondary" onclick="rejeitarMapa('${esc(item.id)}')">🗑 Excluir</button>
        </div>
      </div>
    `).join('');
    cache.mapas.forEach(item => {
      const el2 = $(`mmPreview-${item.id}`);
      if (el2 && window.MapaMental) {
        MapaMental.render(el2, item, {disciplina: item.disciplina, ano: item.ano});
      } else if (el2) {
        el2.innerHTML = '<p class="muted" style="padding:10px">Pré-via indisponível (motor de desenho não carregou).</p>';
      }
    });
  }
}

// ---------------------------------------------------------------- Robô Curador
const EMOJI_TIPO = {'quiz':'🎯','mapa mental':'🧠','vídeo curto':'🎬','video curto':'🎬','jogo':'🎮','resumo ativo':'📘','revisão':'🔁','revisao':'🔁'};

function curadorStatusHtml(){
  const s = cache.curadorStatus;
  if (!s) return '';
  const item = (ok, txt, dica) => `<div style="margin:4px 0">${ok ? '✅' : '⬜'} ${esc(txt)}${ok ? '' : ` <small class="muted">— ${esc(dica)}</small>`}</div>`;
  return `
    <div class="admin-item">
      <div class="pergunta">⚙️ Configuração</div>
      ${item(s.groq, 'Estudativa IA (Groq)', 'sem ela o robô usa sugestões por regras')}
      ${item(s.agendador, 'Agendamento de terça 19h (CURADOR_TOKEN)', 'configure no Render e no GitHub')}
      ${item(s.telegram_bot, 'Bot do Telegram (TELEGRAM_BOT_TOKEN)', 'crie com o @BotFather')}
      ${item(s.telegram_chat, 'Seu chat do Telegram (TELEGRAM_CHAT_ID)', 'use o botão “Descobrir meu chat ID”')}
      ${item(s.email_resend, 'Envio de e-mail (RESEND_API_KEY)', 'crie a chave em resend.com')}
      ${item(s.email_para, 'E-mail de destino (CURADOR_EMAIL_PARA)', 'o e-mail que recebe o relatório')}
      ${item(s.firestore, 'Histórico permanente (Firestore)', 'sem ele, os dados somem a cada redeploy do Render')}
      <div id="chatIdBox" class="resposta" style="margin-top:8px"></div>
    </div>`;
}

function curadorRelatorioHtml(r, aberto){
  const n = r.numeros || {};
  const p = r.periodo || {};
  const sug = (r.sugestoes || []).map((s, i) => `
    <li style="margin-bottom:10px">
      <b style="color:var(--text)">${EMOJI_TIPO[(s.tipo||'').toLowerCase()] || '💡'} ${esc(s.titulo)}</b>
      ${String(s.prioridade||'').toLowerCase()==='alta' ? '<span class="tag alerta">prioridade alta</span>' : `<span class="tag">${esc(s.prioridade||'')}</span>`}
      <br><small>${esc(s.tipo)} · ${esc(s.tema)}${String(s.origem||'').toLowerCase()==='google' ? ' · 🔎 tendência do Google' : ''}</small>
      <br><b>Por quê:</b> ${esc(s.motivo)}
      <br><b>Ideia:</b> ${esc(s.ideia)}
    </li>`).join('');
  const dif = (r.questoes_dificeis || []).slice(0, 6).map(q => `<li>${esc(q.pergunta)} <small>(${esc(q.tema)})</small> — <b style="color:#ff7a7f">${q.acerto_pct}%</b></li>`).join('');
  const temasIa = (r.temas_ia || []).map(t => `<li>${esc(t.tema)} (${esc(t.vezes)}x)</li>`).join('');
  const ganchos = (r.ganchos_google || []).map(g => `<li><b style="color:var(--text)">${esc(g.tendencia)}</b> → ${esc(g.conexao)}</li>`).join('');
  const buscas = (r.buscas_destaque || []).map(b => `<span class="tag">${esc(b)}</span>`).join(' ');
  const tend = r.tendencias || {};
  const emAlta = (tend.em_alta_brasil || []).slice(0, 12).map(t => `<span class="tag">${esc(t.termo)}${t.buscas ? ' · ' + esc(t.buscas) : ''}</span>`).join(' ');
  const googleHtml = (ganchos || buscas || emAlta || (tend.erros || []).length) ? `
        <h3 style="margin:14px 0 6px;color:var(--text)">🔎 Em alta no Google</h3>
        ${ganchos ? `<ul style="padding-left:20px">${ganchos}</ul>` : '<p>Nenhum gancho com História entre os assuntos em alta desta semana.</p>'}
        ${buscas ? `<p><b>Buscas que merecem conteúdo:</b><br>${buscas}</p>` : ''}
        ${emAlta ? `<details><summary style="cursor:pointer">Ver tudo o que está em alta no Brasil</summary><p>${emAlta}</p></details>` : ''}
        ${(tend.erros || []).length ? `<p style="color:#ffb86b"><small>⚠️ ${tend.erros.map(esc).join(' | ')}</small></p>` : ''}` : '';
  const envio = r.envio || {};
  const envioTxt = Object.keys(envio).length
    ? Object.entries(envio).map(([k, v]) => v.ok ? `<span class="tag">✅ ${esc(k)}</span>` : `<span class="tag alerta" title="${esc(v.erro)}">✖ ${esc(k)}</span>`).join('')
    : '<span class="tag">prévia (não enviado)</span>';
  return `
    <details class="admin-item" ${aberto ? 'open' : ''}>
      <summary style="cursor:pointer">
        <span class="pergunta">🧭 Semana de ${esc(p.inicio)} a ${esc(p.fim)}</span>
        <span class="meta" style="display:block">${esc(r.criadoEm)} · ${r.origem === 'agendado' ? 'agendado' : 'manual'} · ${r.fonte === 'ia' ? 'sugestões da IA' : 'sugestões por regras'} ${envioTxt}</span>
      </summary>
      <div class="resposta" style="white-space:normal;margin-top:10px">
        <p>${esc(r.resumo)}</p>
        <p>🎮 ${n.partidas ?? 0} partidas (semana anterior: ${n.partidas_semana_anterior ?? 0}) · ✍️ ${n.respostas_de_alunos ?? 0} respostas de alunos · ✅ acerto médio ${n.acerto_medio_pct ?? '—'}% · 🤖 ${n.perguntas_ia ?? 0} perguntas à IA</p>
        <h3 style="margin:14px 0 6px;color:var(--text)">💡 Sugestões</h3>
        <ol style="padding-left:20px">${sug || '<li>Sem sugestões.</li>'}</ol>
        ${googleHtml}
        ${dif ? `<h3 style="margin:14px 0 6px;color:var(--text)">❗ Questões com mais erros</h3><ul style="padding-left:20px">${dif}</ul>` : ''}
        ${temasIa ? `<h3 style="margin:14px 0 6px;color:var(--text)">🤖 O que perguntaram à IA</h3><ul style="padding-left:20px">${temasIa}</ul>` : ''}
        ${Object.values(envio).some(v => !v.ok) ? `<p style="color:#ff7a7f">Erros no envio: ${Object.entries(envio).filter(([k,v]) => !v.ok).map(([k,v]) => esc(k + ': ' + v.erro)).join(' | ')}</p>` : ''}
      </div>
    </details>`;
}

function renderCurador(el){
  el.innerHTML = `
    <p class="muted" style="margin-top:0">Toda <b>terça às 19h</b> o robô analisa a semana e manda as sugestões no Telegram e no e-mail. Aqui você vê o histórico e pode gerar um relatório na hora.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn primary" id="btnCurPrev" onclick="curadorGerar(false)">👀 Gerar prévia (sem enviar)</button>
      <button class="btn secondary" id="btnCurEnv" onclick="curadorGerar(true)">📨 Gerar e enviar agora</button>
      <button class="btn secondary" onclick="curadorChatId()">🔎 Descobrir meu chat ID do Telegram</button>
    </div>
    <div id="curMsg" class="muted" style="min-height:18px;margin-bottom:10px"></div>
    ${curadorStatusHtml()}
    ${(cache.curador || []).length ? cache.curador.map((r, i) => curadorRelatorioHtml(r, i === 0)).join('') : '<p class="muted">Nenhum relatório ainda. Clique em “Gerar prévia” para ver o primeiro.</p>'}
  `;
}

async function curadorGerar(enviar){
  if (enviar && !confirm('Gerar o relatório agora e enviar pelo Telegram e e-mail?')) return;
  $('curMsg').textContent = '⏳ O robô está analisando os dados... (pode levar até 1 minuto)';
  $('btnCurPrev').disabled = $('btnCurEnv').disabled = true;
  try {
    const r = await fetch('/api/admin/curador/gerar', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({enviar})});
    const data = await r.json();
    if (!r.ok) { $('curMsg').textContent = data.error || data.detail || 'Não foi possível gerar.'; return; }
    cache.curador = [data, ...(cache.curador || [])];
    renderCurador($('content'));
    $('curMsg').textContent = enviar ? '✅ Relatório gerado. Confira os selos de envio abaixo.' : '✅ Prévia gerada (nada foi enviado).';
  } catch (e) {
    $('curMsg').textContent = 'Erro ao conectar com o servidor.';
  } finally {
    const a = $('btnCurPrev'), b = $('btnCurEnv');
    if (a) a.disabled = false; if (b) b.disabled = false;
  }
}

async function curadorChatId(){
  const box = $('chatIdBox');
  if (box) box.textContent = '⏳ Consultando o Telegram...';
  try {
    const data = await fetch('/api/admin/curador/telegram-chats').then(r => r.json());
    if (!data.ok) { box.textContent = data.erro || 'Não foi possível consultar.'; return; }
    if (!data.chats.length) { box.innerHTML = 'Nenhuma conversa encontrada. Abra o seu bot no Telegram, envie <b>/start</b> e clique de novo neste botão.'; return; }
    box.innerHTML = 'Copie o número abaixo para a variável <b>TELEGRAM_CHAT_ID</b> no Render:<br>' +
      data.chats.map(c => `<code style="font-size:16px">${esc(c.chat_id)}</code> ${esc(c.nome)}`).join('<br>');
  } catch (e) { box.textContent = 'Erro ao conectar com o servidor.'; }
}

function toggleEditarMapa(id){
  $(`mmEdit-${id}`).classList.toggle('hidden');
}

async function salvarEdicaoMapa(id){
  let payload;
  try{ payload = JSON.parse($(`mmEdit-${id}`).value); }
  catch(e){ alert('JSON inválido: ' + e.message); return; }
  try{
    const r = await fetch(`/api/admin/mapas/${encodeURIComponent(id)}`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload),
    });
    const data = await r.json();
    if(!r.ok){ alert(data.error || 'Não foi possível salvar.'); return; }
    await loadAll();
  }catch(e){ alert('Erro ao conectar com o servidor.'); }
}

async function aprovarMapa(id){
  if(!confirm('Aprovar este mapa mental? Ele vai entrar na biblioteca pública.')) return;
  try{
    const r = await fetch(`/api/admin/mapas/${encodeURIComponent(id)}/aprovar`, {method:'POST'});
    const data = await r.json();
    if(!r.ok){ alert(data.error || 'Não foi possível aprovar.'); return; }
    await loadAll();
  }catch(e){ alert('Erro ao conectar com o servidor.'); }
}

async function rejeitarMapa(id){
  if(!confirm('Excluir este mapa mental? Isso não pode ser desfeito.')) return;
  try{
    const r = await fetch(`/api/admin/mapas/${encodeURIComponent(id)}/rejeitar`, {method:'POST'});
    const data = await r.json();
    if(!r.ok){ alert(data.error || 'Não foi possível excluir.'); return; }
    await loadAll();
  }catch(e){ alert('Erro ao conectar com o servidor.'); }
}

function copiar(json){
  navigator.clipboard.writeText(json).then(()=>alert('Copiado!'));
}

async function aprovarContribuicao(id){
  if(!confirm('Aprovar essas perguntas? Elas vão entrar direto no banco oficial do jogo (numa aba já existente com a mesma disciplina/tema, ou numa aba nova).')) return;
  try{
    const r = await fetch(`/api/admin/contribuicoes/${encodeURIComponent(id)}/aprovar`, {method:'POST'});
    const data = await r.json();
    if(!r.ok){ alert(data.error || 'Não foi possível aprovar.'); return; }
    alert(`Incluído no banco oficial, na aba "${data.topic}".`);
    await loadAll();
  }catch(e){ alert('Erro ao conectar com o servidor.'); }
}

async function rejeitarContribuicao(id){
  if(!confirm('Rejeitar e descartar essas perguntas? Isso não pode ser desfeito.')) return;
  try{
    const r = await fetch(`/api/admin/contribuicoes/${encodeURIComponent(id)}/rejeitar`, {method:'POST'});
    const data = await r.json();
    if(!r.ok){ alert(data.error || 'Não foi possível rejeitar.'); return; }
    await loadAll();
  }catch(e){ alert('Erro ao conectar com o servidor.'); }
}

checkLogin();
