<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor — Batalha de História</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><span class="eyebrow">BATALHA DE HISTÓRIA</span><h1>Painel do Professor</h1></div><div id="roomBadge" class="badge">Sem sala</div></header><section id="setup" class="card"><h2>Nova partida</h2><label>Tema</label><select id="topic"></select><div class="rules"><span>10 questões</span><span>20s por questão</span><span>1.000 + bônus</span></div><button id="create" class="btn">Criar sala</button></section><section id="game" class="hidden"><div class="grid"><div class="card mainpanel"><div class="topline"><span id="progress"></span><span id="timer"></span></div><div id="content"></div></div><aside class="card side"><h3>Entrar na sala</h3><img id="qr" alt="QR Code"><div id="code" class="roomcode">----</div><p>Os alunos escaneiam o QR Code ou acessam o endereço da sala.</p><h3>Jogadores <span id="count">0</span></h3><ol id="players"></ol></aside></div></section></main><script>
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'); const $=id=>document.getElementById(id); let room=null;
async function load(){const topics=await fetch('/api/topics').then(r=>r.json()); $('topic').innerHTML=topics.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
$('create').onclick=()=>ws.send(JSON.stringify({action:'create',topicId:$('topic').value}));
ws.onmessage=e=>{const m=JSON.parse(e.data); if(m.type==='created'){room=m.room;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('roomBadge').textContent='SALA '+room;$('code').textContent=room;fetch('/api/qr?room='+room).then(r=>r.text()).then(x=>$('qr').src='data:image/png;base64,'+x);render({phase:'lobby',players:[]})}else if(m.type==='state')render(m)};
function render(st){$('progress').textContent=st.phase==='lobby'?'Aguardando jogadores':st.phase==='podium'?'RESULTADO FINAL':`QUESTÃO ${st.questionNumber}/10`;$('timer').textContent=st.phase==='question'?`⏱ ${st.timeLeft}s`:'';$('count').textContent=st.players.length;$('players').innerHTML=st.players.map(p=>`<li><b>${p.name}</b><span>${p.score} pts</span></li>`).join(''); if(st.phase==='lobby')$('content').innerHTML=`<div class="waiting"><div class="big">📱</div><h2>Aguardando jogadores</h2><p>Quando estiverem prontos, inicie a partida.</p><button class="btn" onclick="ws.send(JSON.stringify({action:'start'}))">Iniciar partida</button></div>`; else if(st.phase==='question'){const q=st.question;$('content').innerHTML=`<div class="question"><h2>${q.question}</h2><div class="answers">${q.options.map((x,i)=>`<div class="answer"><b>${String.fromCharCode(65+i)}</b>${x}</div>`).join('')}</div></div>`} else if(st.phase==='result'){$('content').innerHTML=`<div class="waiting"><div class="big">✓</div><h2>Questão encerrada</h2><p>Confira o ranking.</p><button class="btn" onclick="ws.send(JSON.stringify({action:'next'}))">${st.questionNumber>=10?'Ver pódio':'Próxima questão'}</button></div>`} else {$('content').innerHTML=`<div class="waiting"><div class="big">🏆</div><h2>Resultado final</h2>${st.players.slice(0,3).map((p,i)=>`<div class="podiumline">${i+1}º — <b>${p.name}</b> — ${p.score} pts</div>`).join('')}<button class="btn" onclick="location.reload()">Nova partida</button></div>`}} load();
</script></body></html>
